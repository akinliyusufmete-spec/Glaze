name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild test \
            -project Glaze.xcodeproj \
            -scheme Glaze \
            -destination 'platform=macOS' \
            -resultBundlePath build/Tests.xcresult \
            2>&1 | tee build/xcodebuild.log | tail -n 40

      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -E "error:|failed|Test Case .* failed" build/xcodebuild.log | sort -u | head -n 40 \
            | while IFS= read -r line; do echo "::error::${line:0:900}"; done

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/xcodebuild.log
